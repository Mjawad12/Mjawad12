<svg viewBox="0 0 1000 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="Technical stack — languages, frontend, backend, 3D, cloud, tooling">

    <style>
        :root {
            --primary: #ededed;
            --secondary: #cfcfcf;
            --dim: #cfcfcf;
            --accent: #cfcfcf;
        }

        .mono {
            font-family: "General Sans";
        }

        .secondary-font {
            font-family:
                ui-monospace,
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Consolas,
                "Liberation Mono",
                monospace;
        }

        .rise {
            opacity: 0;
            animation:
                rise .6s cubic-bezier(.2, .7, .2, 1) forwards;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .a1 {
            animation-delay: .1s;
        }

        .a2 {
            animation-delay: .2s;
        }

        .a3 {
            animation-delay: .3s;
        }

        .a4 {
            animation-delay: .4s;
        }

        .a5 {
            animation-delay: .5s;
        }

        .a6 {
            animation-delay: .6s;
        }

        .a7 {
            animation-delay: .7s;
        }

        .a8 {
            animation-delay: .8s;
        }

        @media (prefers-reduced-motion: reduce) {
            .rise {
                animation: none;
                opacity: 1;
            }
        }
    </style>

    <!-- Top rule -->
    <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--secondary)" stroke-width="1" />

    <!-- Label -->
    <g class="fade a1">
        <text class="mono" fill="var(--secondary)" x="48" y="44" font-size="11" letter-spacing="3.5">
            TECHNICAL STACK
        </text>
    </g>



    <!-- COLUMN RULE -->

    <line x1="178" y1="78" x2="178" y2="332" stroke="var(--secondary)" stroke-width="1" opacity=".4" />


    <!-- LANGUAGES -->

    <text class="mono rise a1" x="48" y="100" font-size="11" fill="var(--secondary)" letter-spacing="2">
        LANGUAGES
    </text>

    <text class="mono rise a1" x="200" y="100" font-size="14" fill="var(--primary)">
        JavaScript · TypeScript · Python · Java · C++ · C# · Bash · SQL
    </text>


    <!-- FRONTEND -->

    <text class="mono rise a2" x="48" y="132" font-size="11" fill="var(--secondary)" letter-spacing="2">
        FRONTEND
    </text>

    <text class="mono rise a2" x="200" y="132" font-size="14" fill="var(--primary)">
        React · Next.js · React Router · HTML · CSS · Sass · Tailwind CSS · Bootstrap
    </text>


    <!-- BACKEND -->

    <text class="mono rise a3" x="48" y="164" font-size="11" fill="var(--secondary)" letter-spacing="2">
        BACKEND
    </text>

    <text class="mono rise a3" x="200" y="164" font-size="14" fill="var(--primary)">
        Node.js · Express · MongoDB · Mongoose · MySQL · PostgreSQL · Redis · Firebase
    </text>


    <!-- 3D / MOTION -->

    <text class="mono rise a4" x="48" y="196" font-size="11" fill="var(--secondary)" letter-spacing="2">
        3D / MOTION
    </text>

    <text class="mono rise a4" x="200" y="196" font-size="14" fill="var(--primary)">
        Three.js · WebGL · GSAP · Framer Motion · Blender
    </text>


    <!-- CLOUD / DEVOPS -->

    <text class="mono rise a5" x="48" y="228" font-size="11" fill="var(--secondary)" letter-spacing="2">
        CLOUD / DEVOPS
    </text>

    <text class="mono rise a5" x="200" y="228" font-size="14" fill="var(--primary)">
        AWS · Vercel · Docker · Nginx · Git · GitHub · npm
    </text>


    <!-- ECOMMERCE -->

    <text class="mono rise a6" x="48" y="260" font-size="11" fill="var(--secondary)" letter-spacing="2">
        ECOMMERCE
    </text>

    <text class="mono rise a6" x="200" y="260" font-size="14" fill="var(--primary)">
        Shopify · Product Configurators · Customizers · Print Workflows
    </text>


    <!-- MOBILE -->

    <text class="mono rise a7" x="48" y="292" font-size="11" fill="var(--secondary)" letter-spacing="2">
        MOBILE
    </text>

    <text class="mono rise a7" x="200" y="292" font-size="14" fill="var(--primary)">
        Expo · React Native
    </text>


    <!-- TOOLS -->

    <text class="mono rise a8" x="48" y="324" font-size="11" fill="var(--secondary)" letter-spacing="2">
        TOOLS
    </text>

    <text class="mono rise a8" x="200" y="324" font-size="14" fill="var(--primary)">
        Figma · VS Code · Postman · Puppeteer · Nodemon
    </text>

</svg>