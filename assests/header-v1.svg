<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Muhammad Jawad — Full Stack Developer">

  <style>
    :root {
      --primary: #ededed;
      --secondary: #cfcfcf;
      --dim: #cfcfcf;
      --accent: #cfcfcf;
    }

    .mono {
     font-family: "General Sans";
    }

    .secondary-font {
       font-family:
        ui-monospace,
        "SFMono-Regular",
        "SF Mono",
        Menlo,
        Consolas,
        "Liberation Mono",
        monospace; 
    }

    .draw {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .rise {
      opacity: 0;
      animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade {
      opacity: 0;
      animation: fade .7s ease forwards;
    }

    @keyframes fade {
      to {
        opacity: 1;
      }
    }

    .a1 { animation-delay: .2s; }
    .a2 { animation-delay: .5s; }
    .a3 { animation-delay: .9s; }
    .a4 { animation-delay: 1.2s; }
    .a5 { animation-delay: 1.4s; }
    .a6 { animation-delay: 1.7s; }

    .rot {
      opacity: 0;
      animation: rot 12s linear infinite;
    }

    .r1 { animation-delay: 1.7s; }
    .r2 { animation-delay: 4.7s; }
    .r3 { animation-delay: 7.7s; }
    .r4 { animation-delay: 10.7s; }

    @keyframes rot {
      0% { opacity: 0; }
      1.5% { opacity: 1; }
      18% { opacity: 1; }
      20% { opacity: 0; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw,
      .rise,
      .fade,
      .rot {
        animation: none;
      }

      .draw {
        stroke-dashoffset: 0;
      }

      .rise,
      .fade {
        opacity: 1;
      }

      .rot {
        opacity: 0;
      }

      .rot.r1 {
        opacity: 1;
      }
    }
  </style>

  <!-- Top rule -->
  <line
    class="draw a1"
    x1="48"
    y1="58"
    x2="952"
    y2="58"
    stroke="var(--secondary)"
    stroke-width="1"
  />

  <!-- Label -->
  <g class="fade a1">
    <text
      class="mono"
      fill="var(--secondary)"
      x="48"
      y="44"
      font-size="11"
      letter-spacing="3.5"
    >
      DEVELOPER / PORTFOLIO
    </text>
  </g>

  <!-- Name -->
  <g class="rise a2">
    <text
      fill="var(--primary)"
      class="mono"
      x="46"
      y="176"
      font-size="68"
      letter-spacing="-3"
    >
      Muhammad Jawad
    </text>
  </g>

  <!-- Main role -->
  <g class="fade a3">
    <text
      fill="var(--secondary)"
      class="mono"
      x="48"
      y="214"
      font-size="19"
    >
      Full Stack Developer — Next.js, Three.js &amp; MERN.
    </text>
  </g>

  <!-- Focus -->
  <g class="fade a4">

    <text
      fill="var(--dim)"
      class="secondary-font"
      x="48"
      y="274"
      font-size="12.5"
      letter-spacing="1"
    >
      FOCUS  ▸
    </text>

    <text
      fill="var(--accent)"
      class="secondary-font"
      x="128"
      y="274"
      font-size="12.5"
      letter-spacing="1"
    >
      Full-Stack Systems · 3D experiences 
    </text>

  </g>

  <!-- Availability -->
  <g class="fade a5">

    <text
      fill="var(--dim)"
      class="secondary-font"
      x="48"
      y="300"
      font-size="12.5"
      letter-spacing="1"
    >
      OPEN TO FREELANCE · COLLABORATIONS · PRODUCT DEVELOPMENT
    </text>

  </g>

  <!-- Bottom rule -->
  <line
    class="draw a5"
    x1="48"
    y1="342"
    x2="952"
    y2="342"
    stroke="var(--secondary)"
    stroke-width="1"
  />

  <!-- Bottom metadata -->
  <g class="fade a6">

    <text
      fill="var(--secondary)"
      class="mono"
      x="48"
      y="374"
      font-size="11.5"
      letter-spacing="3"
    >
      NEXT.JS
    </text>

    <text
      fill="var(--accent)"
      class="mono"
      x="145"
      y="374"
      font-size="11.5"
    >
      ·
    </text>

    <text
      fill="var(--secondary)"
      class="mono"
      x="175"
      y="374"
      font-size="11.5"
      letter-spacing="3"
    >
      THREE.JS
    </text>

    <text
      fill="var(--accent)"
      class="mono"
      x="280"
      y="374"
      font-size="11.5"
    >
      ·
    </text>

    <text
      fill="var(--secondary)"
      class="mono"
      x="310"
      y="374"
      font-size="11.5"
      letter-spacing="3"
    >
      MERN STACK
    </text>

    <text
      fill="var(--accent)"
      class="mono"
      x="430"
      y="374"
      font-size="11.5"
    >
      ·
    </text>

    <text
      fill="var(--secondary)"
      class="mono"
      x="460"
      y="374"
      font-size="11.5"
      letter-spacing="3"
    >
      WEBGL / 3D
    </text>

    <text
      fill="var(--secondary)"
      class="mono"
      x="952"
      y="374"
      font-size="11.5"
      letter-spacing="3"
      text-anchor="end"
    >
      PAKISTAN
    </text>

  </g>

</svg>